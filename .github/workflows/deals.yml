name: Roblox Limited Deal Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: roblox-radar-state-main
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Run Limited Deal Radar
        env:
          DEALS_DISCORD_WEBHOOK: ${{ secrets.DEALS_DISCORD_WEBHOOK }}
        run: python deals.py

      - name: Save deal state
        run: |
          git config user.name "Roblox Limited Deal Radar"
          git config user.email "actions@users.noreply.github.com"

          if [ ! -f deals_state.json ]; then
            echo "No deals_state.json created this run."
            exit 0
          fi

          git add deals_state.json

          if git diff --cached --quiet; then
            echo "No deal state changes."
            exit 0
          fi

          git commit -m "Update limited deal radar state"

          git pull --rebase origin main
          git push origin main
