name: Roblox Item Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: roblox-radar-state-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Run Roblox Item Radar
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: Save radar state
        run: |
          git config user.name "Roblox Item Radar"
          git config user.email "actions@users.noreply.github.com"

          if [ ! -f seen_items.json ]; then
            echo "No seen_items.json created this run."
            exit 0
          fi

          git add seen_items.json

          if git diff --cached --quiet; then
            echo "No radar state changes."
            exit 0
          fi

          git commit -m "Update Roblox radar state"

          git pull --rebase origin main
          git push origin main
